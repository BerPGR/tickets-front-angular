<div
  class="flex justify-center items-center w-full min-h-screen bg-gradient-to-br from-slate-50 to-emerald-200"
>
  <p-card class="w-[30%]">
    <ng-template #title>Bem-vindo ao sistema de tickets!</ng-template>
    <form id="authform" [formGroup]="authForm" (ngSubmit)="login()" class="space-y-10 mt-2">
      <p-floatlabel variant="on">
        <input
          class="w-full"
          id="on_email"
          pInputText
          formControlName="email"
          name="email"
          type="email"
        />
        <label for="on_email">E-mail</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input
          pInputText
          type="password"
          name="password"
          id="on_password"
          formControlName="password"
          class="w-full"
        />
        <label for="on_password">Senha</label>
      </p-floatlabel>
      <div class="w-full"></div>
      <p-button type="submit" styleClass="w-full" raised="true" label="Entrar" />
    </form>
    <div class="flex flex-col items-center space-y-10">
      <p-divider align="center">
        <b>OU</b>
      </p-divider>
      <div class="w-full">
        <p-button
          severity="secondary"
          label="Nova conta"
          [raised]="true"
          styleClass="w-full"
        />
      </div>
    </div>
  </p-card>
</div>
