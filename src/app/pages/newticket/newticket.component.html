<div class="flex items-center justify-center">
  <form class="w-3/4" #frm="ngForm" (onSubmit)="createTicket()">
    <p-card>
      <ng-template #title> Criar novo ticket </ng-template>
      <div class="h-[1px] bg-gray-200 w-full my-3"></div>
      <p-floatlabel variant="on">
        <p-select
          class="w-1/3"
          [options]="teams"
          name="team"
          optionLabel="name"
          [(ngModel)]="selectedTeam"
          id="on_label_equipe"
        />
        <label for="on_label_equipe">Equipe</label>
      </p-floatlabel>

      <ng-template #footer>
        <div class="flex justify-end gap-4 items-center">
          <p-button (onClick)="createTicket()" severity="info" [raised]="true" size="small" label="Criar ticket" />
        </div>
      </ng-template>
    </p-card>
  </form>
</div>
